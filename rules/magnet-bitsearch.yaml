name: "BitSearch 磁力"
type: magnet
enabled: true
version: 1
update_url: "https://raw.githubusercontent.com/Maomaokuxs/rulesearch/main/rules/magnet-bitsearch.yaml"

request:
  url: "https://bitsearch.to/search?q={keyword}"
  method: GET
  timeout: 20

parse:
  list: "div.bg-white.rounded-lg"
  fields:
    title: {select: "h3 a", attr: text}
    url: {select: 'a[href^="magnet:"]', attr: href}

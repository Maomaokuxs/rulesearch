name: "蜜柑计划"
type: magnet
enabled: true
version: 1
update_url: "https://raw.githubusercontent.com/Maomaokuxs/rulesearch/master/rules/magnet-mikanani.yaml"

request:
  url: "https://mikanani.me/Home/Search?searchstr={keyword}"
  method: GET
  timeout: 20

# 蜜柑计划：服务端渲染 HTML，纯 CSS 选择器解析
parse:
  list: "div.m-search-item"
  fields:
    title: {select: ".left .text a", attr: text}
    url: {select: '.right a[href^="magnet:"]', attr: href}
    time: {select: ".date", attr: text}
